name: AI Agent

on:
  workflow_call:
    inputs:
      mode:
        description: "assignment, review, or pr_review"
        required: true
        type: string
      issue_number:
        description: "Issue number for assignment mode"
        required: false
        type: string
      pr_number:
        description: "PR number for review or pr_review mode"
        required: false
        type: string
      branch_name:
        description: "Preferred branch name to use"
        required: false
        type: string
      is_product:
        description: "Whether the issue is labelled 'product' (routes the task to the testing staging env)"
        required: false
        type: boolean
        default: false
      base_branch:
        description: "Base branch to cut the feature branch from and target the PR against"
        required: false
        type: string
        default: main
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true
      AWS_REGION:
        required: true
      SLACK_AI_WEBHOOK_URL:
        required: false
      GH_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ai-agent-${{ inputs.issue_number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Determine context
        id: ctx
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"

          if [ "$MODE" = "assignment" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
            BRANCH="${{ inputs.branch_name }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="ai/issue-${ISSUE_NUMBER}"
            fi
            echo "mode=assignment" >> "$GITHUB_OUTPUT"
            echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "base=${{ inputs.base_branch }}" >> "$GITHUB_OUTPUT"

          elif [ "$MODE" = "review" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            BRANCH="${{ inputs.branch_name }}"
            echo "mode=review" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          elif [ "$MODE" = "pr_review" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            BRANCH="${{ inputs.branch_name }}"
            echo "mode=pr_review" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          else
            echo "Unsupported mode: $MODE"
            exit 1
          fi

      # NOTE: testing-env deployment for product review is handled in each
      # repo's own workflows (e.g. ltu-web's ai-testing-deploy.yml /
      # ai-testing-redeploy.yml, ltu-mobile's ai-ota-deploy.yml /
      # ai-ota-redeploy.yml), NOT here. This reusable workflow always cuts the
      # feature branch from — and targets the PR against — `base_branch` (main).

      - name: Notify Slack on product-change assignment
        if: |
          inputs.mode == 'assignment' &&
          contains(github.event.issue.labels.*.name, 'product')
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_AI_WEBHOOK_URL }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_AI_WEBHOOK_URL not configured, skipping notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \":robot_face: *AI Dev started working on a product-change ticket*\n*Issue:* <${ISSUE_URL}|#${ISSUE_NUMBER} — ${ISSUE_TITLE}>\n*Repo:* \`${REPO}\`\"
            }"

      - name: Check whether branch exists on origin
        id: branch-check
        shell: bash
        run: |
          BRANCH="${{ steps.ctx.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find open PR for branch
        id: pr-check
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`
            });

            if (prs.data.length > 0) {
              core.setOutput("exists", "true");
              core.setOutput("number", String(prs.data[0].number));
              core.setOutput("url", prs.data[0].html_url);
            } else {
              core.setOutput("exists", "false");
              core.setOutput("number", "");
              core.setOutput("url", "");
            }

      - name: Run Claude Code via Bedrock
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          show_full_output: "true"
          allowed_non_write_users: "*"
          claude_args: |
            --model arn:aws:bedrock:eu-central-1:707525354258:inference-profile/eu.anthropic.claude-sonnet-4-6
            --allowedTools Edit,Read,Write,Bash(git:*),Bash(gh:*),Bash(grep:*),Bash(find:*)
          prompt: |
            You are working in repository ${{ github.repository }}.

            Follow CLAUDE.md strictly.

            Execution mode: ${{ steps.ctx.outputs.mode }}

            Repository context:
            - Preferred branch: ${{ steps.ctx.outputs.branch }}
            - Base branch (cut the feature branch from this, and target the PR against it): ${{ steps.ctx.outputs.base }}
            - Branch already exists on origin: ${{ steps.branch-check.outputs.exists }}
            - Existing open PR for branch: ${{ steps.pr-check.outputs.exists }}
            - Existing open PR number: ${{ steps.pr-check.outputs.number }}

            Global rules:
            - Keep changes minimal and strictly in scope.
            - Do not introduce new dependencies unless explicitly required.
            - Do not refactor unrelated files.
            - If the preferred branch already exists, continue working on that same branch.
            - If the preferred branch does not exist, create it FROM the base branch ${{ steps.ctx.outputs.base }} (e.g. `git fetch origin ${{ steps.ctx.outputs.base }} && git checkout -b ${{ steps.ctx.outputs.branch }} origin/${{ steps.ctx.outputs.base }}`).
            - If an open PR already exists for this branch, update that PR instead of opening a new one.
            - Run relevant validation if applicable.
            - Commit your changes.
            - If this is an ltu-web assignment, create a release tag BEFORE pushing (see below).
            - Push your changes only after the tag has been created (if applicable).

            Assignment mode instructions:
            - Read GitHub issue #${{ steps.ctx.outputs.issue_number }} carefully.
            - Understand the goal, scope, and constraints before changing code.
            - Use branch: ${{ steps.ctx.outputs.branch }}, cut from the base branch ${{ steps.ctx.outputs.base }}.
            - Implement the requested change.
            - If there is no open PR yet for this branch, open one against the base branch (`gh pr create --base ${{ steps.ctx.outputs.base }} ...`) and link it to the issue.
            - If a PR already exists, update the existing PR instead of opening a new one.
            - Title the PR exactly like this: "AI: Issue#${{ steps.ctx.outputs.issue_number }} [issue title]"

            ltu-web release tag instructions (assignment mode only):
            - These instructions apply ONLY when the repository is ltu-web.
            - After committing your changes but BEFORE pushing to origin, create an annotated git tag.
            - Tag name format: release-ai-${{ steps.ctx.outputs.issue_number }}
            - Tag message format: "[type]: [semantic release description of the task]"
              - Replace [type] with exactly one of:
                - Feat   — new functionality visible to end users
                - Fix    — bug fixes and small improvements
                - Tech   — non-user-facing changes (refactors, config, tooling, tests, etc.)
              - Replace [semantic release description of the task] with a concise description
                of what was implemented, written in the imperative mood (e.g. "add user profile avatar upload").
              - Example: "Feat: add dark mode toggle to settings screen"
            - Create the tag with: git tag -a release-ai-${{ steps.ctx.outputs.issue_number }} -m "[type]: [description]"
            - Push both the branch and the tag: git push origin ${{ steps.ctx.outputs.branch }} && git push origin release-ai-${{ steps.ctx.outputs.issue_number }}

            Review mode instructions:
            - Read PR #${{ steps.ctx.outputs.pr_number }} completely, including:
              - the review summary,
              - all review comments,
              - all inline comments,
              - unresolved discussion threads.
            - Work only on the existing branch: ${{ steps.ctx.outputs.branch }}.
            - Apply the requested review changes and directly related fixes only.
            - Do not open a new PR.
            - Push additional commits to the same branch.

            PR review mode instructions:
            You are a senior engineer reviewing a pull request in repository ${{ github.repository }}.
            Your job is to enforce code quality standards strictly and without exception.
            You are the last line of defense against technical debt.

            Read PR #${{ steps.ctx.outputs.pr_number }} completely, including all changed files, before writing your review.

            ## What to check

            ### 1. Code Layer Violations (CRITICAL)
            There are two types of components — apply different rules to each:

            **Global components** (`components/global/` in ltu-mobile, `src/components/global/` in ltu-web):
            - Must be pure UI — no API calls, no service calls, no business logic
            - Must be reusable across features and screens
            - Must not know where their data comes from or which feature they belong to
            - Must contain only micro layout — spacing, sizing, and positioning intrinsic to the component itself. They must NOT define external spacing (margin, padding) that affects their position relative to surrounding elements — that is the responsibility of the parent/screen component
            - In ltu-web: must wrap Bootstrap components — raw Bootstrap components (e.g. Button, Form, Modal from react-bootstrap) must never be used in screen or feature components directly

            **Screen / Feature components** (`screens/`, `src/views/`, or `components/` outside of `global/`):
            - May call services and hooks
            - May contain feature-specific logic
            - Compose global components, hooks, services and utilities together
            - Are responsible for macro layout — spacing between components, page structure, positioning of elements relative to each other
            - Subcomponents within a feature folder (e.g. modal children) may call hooks and access context directly. There is no requirement to centralize hook calls in a parent component unless the same logic is duplicated across multiple subcomponents.

            Flag as MUST FIX if:
            - A global component makes API calls, calls services, or contains business logic
            - A global component is tied to a specific feature (hardcoded IDs, feature-specific props or naming)
            - A global component defines external margin or padding that affects its position relative to surrounding elements (e.g. marginBottom, paddingTop on the root element without it being a prop)
            - A screen component (ltu-web) uses raw Bootstrap components directly instead of the wrapped global components
            - A service prepares UI data or transforms data for a specific screen (name like getXForYScreen)
            - Business logic (permissions, status derivation, domain decisions) is inside any component instead of a utility function
            - A hook renders JSX or contains stateless helper logic that belongs in utils
            - Multiple unrelated components are defined in the same file
            - A reusable UI primitive is placed inside a screen folder instead of components/global/
            - A screen component directly contains GraphQL queries instead of going through services/

            ### 2. Code Reuse Violations (CRITICAL)
            For every new utility function, hook, service, or component in the PR:
            - Search the codebase using grep or find for similar existing implementations before flagging
            - Check utils/, services/, hooks/, and components/global/ for equivalent logic

            Flag as MUST FIX if:
            - A color hex code is hardcoded instead of using a constant from constants/
            - A global UI component is reimplemented instead of reused
            - Logic that already exists in utils/ or services/ is duplicated inline
            - A new utility function is placed inside a component instead of utils/
            - Styled components or StyleSheet styles duplicate existing global styles
            - A new hook duplicates logic that already exists in hooks/

            Flag as SHOULD FIX if:
            - A new component is not structured to be reusable even though it could be
            - Props are too specific and tie the component to one use case
            - A pattern is repeated 2+ times and could be extracted into a shared utility or component

            ### 3. Coding Standards
            Flag as MUST FIX for new files:
            - File is .js instead of .ts / .tsx
            - Styles are inline instead of using styled-components or StyleSheet.create()
            - Types/interfaces are defined in the same file as the component instead of a .types.ts file
            - Styles are defined in the same file as the component instead of a .styles.ts file

            Flag as NOTE for legacy .js files:
            - Mention the file needs to be refactored but do not block the PR for this reason alone

            ### 4. UX & Design Standards
            Flag as SHOULD FIX if:
            - A data-fetching component has no loading state
            - A data-fetching component has no error state
            - A list or data display has no empty state
            - A user action has no feedback (loading indicator, disabled state, success/error message)

            ### 5. Clean Code Principles

            **Single Responsibility**
            Flag as MUST FIX if:
            - A component, hook, or function clearly does more than one thing
            - A service function handles multiple unrelated entities or concerns
            - A utility function prepares or transforms data specifically for one screen or component
            - A utils file bundles unrelated helper functions that have no common concern

            Flag as SHOULD FIX if:
            - A component could be split into smaller focused pieces without significant overhead

            **File & Function Size**
            Flag as MUST FIX if:
            - A new file exceeds 300 lines — suggest what could be extracted and into which file/layer
            - A single function or component render exceeds 80 lines — suggest what could be extracted

            Flag as SHOULD FIX if:
            - A file is between 200-300 lines and could reasonably be split

            **DRY — No Duplicate Concepts**
            Flag as MUST FIX if:
            - Two functions or components do the same thing but have different names or slightly different implementations
            - The same transformation or mapping logic appears in more than one place

            **Meaningful Names**
            Follow existing naming conventions:
            - Services: [entity][Action]Service e.g. getUserDataService
            - Hooks: use[Action/Entity] e.g. useJoinMeeting
            - Utils: descriptive camelCase e.g. formatDate
            - Components: PascalCase, descriptive of what they render

            Flag as SHOULD FIX if:
            - A name is too generic (e.g. handleData, doStuff, Component1)
            - A name describes implementation rather than intent
            - A name breaks established conventions

            **Abstraction Levels**
            Flag as SHOULD FIX if:
            - A function mixes high-level orchestration with low-level implementation details
            - A component mixes data transformation with rendering logic

            **Primitive Obsession**
            Flag as SHOULD FIX if:
            - any, string, or number is used where a specific type would be clearer
            - Object shapes are inline instead of a named interface in a .types.ts file
            - Functions accept many primitive parameters that belong together in an object

            ## How to submit your review
            1. For every violation, add an inline comment on the exact line with:
               - The severity: 🔴 MUST FIX / 🟡 SHOULD FIX / 🔵 NOTE
               - A short explanation of what is wrong
               - A concrete suggestion for how to fix it

            2. Write a review summary that:
               - Lists all MUST FIX items grouped by category
               - Lists all SHOULD FIX items
               - Mentions any positive patterns worth keeping

            3. Submit the review as:
               - REQUEST_CHANGES if there are any MUST FIX items
               - COMMENT if there are only SHOULD FIX or NOTE items, with the message: "✅ No blocking violations found. This PR is ready for testing."
               - Never submit an APPROVE review — approval requires human sign-off after testing

            ## Important rules
            - Do NOT approve a PR that has MUST FIX violations, even if the code "works"
            - Do NOT ignore violations because the file is large or the change is small
            - Do NOT suggest adding new dependencies
            - Legacy .js files get a NOTE but must never block the PR. This applies to all violations found in .js files — including raw Bootstrap usage, missing types, and inline styles. Do not flag anything in a .js file as MUST FIX or SHOULD FIX.
            - Be direct and specific — vague comments like "consider refactoring" are not helpful
            - Never modify any files — this is a review only, not an implementation task
            - Ignore all files inside the `amplify/` directory — do not review, comment on, or flag any violations in files under that path

      - name: Summarize result
        if: always()
        run: |
          echo "Mode: ${{ steps.ctx.outputs.mode }}"
          echo "Branch: ${{ steps.ctx.outputs.branch }}"
          echo "Existing branch: ${{ steps.branch-check.outputs.exists }}"
          echo "Existing open PR: ${{ steps.pr-check.outputs.exists }}"
          echo "Existing open PR number: ${{ steps.pr-check.outputs.number }}"
